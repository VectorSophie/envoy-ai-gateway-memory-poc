# ── Memory ExtProc gRPC 서비스 ────────────────────────────────────────────────
#
# 역할: Envoy ExtProc로 동작하며 요청을 가로채 Redis에서 대화 히스토리를 조회,
#       현재 메시지와 병합 후 LLM에 전달. 응답에서 assistant 메시지 추출 후 저장.
#
# Redis 키: memory:session:{session_id} — Memory Service REST API와 동일한 형식
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-extproc
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-extproc
  template:
    metadata:
      labels:
        app: memory-extproc
    spec:
      containers:
        - name: memory-extproc
          image: memory-extproc:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 50051
          env:
            - name: REDIS_HOST
              value: redis.redis-system.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: MEMORY_TTL_SECONDS
              value: "3600"
            - name: MAX_HISTORY_LENGTH
              value: "20"
            - name: REDIS_TLS_ENABLED
              value: "false"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: memory-extproc
  namespace: default
spec:
  selector:
    app: memory-extproc
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
  type: ClusterIP
