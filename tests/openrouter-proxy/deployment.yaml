apiVersion: apps/v1
kind: Deployment
metadata:
  name: openrouter-proxy
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openrouter-proxy
  template:
    metadata:
      labels:
        app: openrouter-proxy
    spec:
      containers:
        - name: openrouter-proxy
          image: openrouter-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openrouter-secret
                  key: OPENROUTER_API_KEY
            - name: OPENROUTER_BASE_URL
              value: https://openrouter.ai/api/v1
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: openrouter-proxy
  namespace: default
spec:
  selector:
    app: openrouter-proxy
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
