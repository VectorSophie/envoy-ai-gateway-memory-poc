apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-llm-backend
  template:
    metadata:
      labels:
        app: mock-llm-backend
    spec:
      containers:
        - name: mock-llm-backend
          image: mock-llm-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm-backend
  namespace: default
spec:
  selector:
    app: mock-llm-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
