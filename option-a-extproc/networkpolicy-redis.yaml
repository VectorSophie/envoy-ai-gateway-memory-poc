---
# Redis 접근 제한 — memory-extproc Pod만 Redis master/replica에 접근 가능.
# architecture.md 결정 5 "Redis 보안/네트워크 가정"의 운영 전 필수 결정 #2 구현체.
# PoC 단계에서는 apply 검증만 수행, 운영 전환 시 실제 정책 enforcement 확인.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-memory-extproc
  namespace: ai-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    # memory-extproc Pod → Redis (사용자 정의 허용)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-gateway-system
          podSelector:
            matchLabels:
              app: memory-extproc
      ports:
        - protocol: TCP
          port: 6379
    # Redis Pod 간 통신 (master ↔ replica 복제 트래픽) 필수 허용
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
