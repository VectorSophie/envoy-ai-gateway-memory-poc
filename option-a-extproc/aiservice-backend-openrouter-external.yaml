---
# 운영 전환용 Envoy Gateway Backend — 실제 OpenRouter FQDN을 래핑.
# 기본 PoC는 `aiservice-backend-openai.yaml`의 mock 경로를 유지하고,
# 이 파일은 외부 HTTPS 경로 전환 시점에만 적용한다.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: openrouter-api-backend-eg
  namespace: default
spec:
  endpoints:
    - fqdn:
        hostname: openrouter.ai
        port: 443
---
apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: AIServiceBackend
metadata:
  name: ai-service-openrouter-external
  namespace: default
spec:
  schema:
    # OpenRouter는 OpenAI-compatible chat completions API를 제공하므로
    # AI Gateway provider schema는 계속 OpenAI를 사용한다.
    name: OpenAI
    # OpenRouter의 OpenAI-compatible endpoint는 /api/v1 아래에 있으므로
    # 공식 경로도 동일한 prefix로 upstream path를 맞춘다.
    prefix: /api/v1
  backendRef:
    # 운영 전환 시 외부 OpenRouter Backend로 교체.
    name: openrouter-api-backend-eg
    kind: Backend
    group: gateway.envoyproxy.io
