apiVersion: aigateway.envoyproxy.io/v1alpha1
kind: GatewayConfig
metadata:
  name: memory-enabled-config
  namespace: default
spec:
  extProc:
    kubernetes:
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
---
# Gateway는 annotation으로 GatewayConfig를 연결한다.
# 기존 Gateway가 있다면 아래 annotation만 추가하면 된다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ai-gateway
  namespace: default
  annotations:
    aigateway.envoyproxy.io/gateway-config: memory-enabled-config
spec:
  gatewayClassName: envoy-gateway-class
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
